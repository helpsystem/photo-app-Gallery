
<div class="min-h-screen w-full p-4 sm:p-6 lg:p-8">
  <main class="max-w-7xl mx-auto glass-card rounded-3xl shadow-2xl overflow-hidden">
    <!-- Window Controls & Navigation -->
    <div class="h-14 flex items-center px-4 border-b border-white/10">
      <div class="flex items-center space-x-2">
        <div class="w-3.5 h-3.5 bg-red-500 rounded-full"></div>
        <div class="w-3.5 h-3.5 bg-yellow-500 rounded-full"></div>
        <div class="w-3.5 h-3.5 bg-green-500 rounded-full"></div>
      </div>
      <nav class="flex-grow flex justify-center items-center space-x-6 text-sm font-semibold">
        <a routerLink="/dashboard" 
           routerLinkActive="text-cyan-400 border-cyan-400" 
           [routerLinkActiveOptions]="{exact: true}" 
           class="text-slate-300 border-b-2 border-transparent hover:text-white transition-colors px-2 py-3">
           Dashboard
        </a>
        <a routerLink="/invoice-builder" 
           routerLinkActive="text-cyan-400 border-cyan-400" 
           class="text-slate-300 border-b-2 border-transparent hover:text-white transition-colors px-2 py-3">
           Invoice Builder
        </a>
         <a routerLink="/flyer-designer" 
           routerLinkActive="text-cyan-400 border-cyan-400" 
           class="text-slate-300 border-b-2 border-transparent hover:text-white transition-colors px-2 py-3">
           Flyer Designer
        </a>
      </nav>
      <div class="w-20"></div> <!-- Placeholder for symmetry -->
    </div>

    <!-- Main Content Area -->
    <router-outlet></router-outlet>
  </main>
</div>
